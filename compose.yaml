services:
  frontend:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./server
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the environment or root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or root .env file}
      PORT: "5000"
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - uploads:/app/uploads
    expose:
      - "5000"
    restart: unless-stopped

volumes:
  uploads:
